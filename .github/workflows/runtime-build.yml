name: runtime-build

on:
  push:
    branches: ['main']
    tags-ignore: ['**']
    paths:
      - 'src/**'
      - '!src/**/*.md'
      - 'assets/**/*.json'
      - '!assets/asset-patch/**'
      - 'admin/**'
      - '!admin/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docs/generated/character_table.json'
      - 'out/**'
      - 'tools/build-runtime-artifact.cjs'
      - 'tools/check-out-artifacts.cjs'
      - 'tools/runtime-build-policy.json'
      - 'tools/build-cloud-overlay.py'
      - 'tests/runtime-build-*.test.cjs'
      - 'tests/cloud-overlay-*.test.py'
      - '.github/workflows/runtime-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - '!src/**/*.md'
      - 'assets/**/*.json'
      - '!assets/asset-patch/**'
      - 'admin/**'
      - '!admin/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docs/generated/character_table.json'
      - 'out/**'
      - 'tools/build-runtime-artifact.cjs'
      - 'tools/check-out-artifacts.cjs'
      - 'tools/runtime-build-policy.json'
      - 'tools/build-cloud-overlay.py'
      - 'tests/runtime-build-*.test.cjs'
      - 'tests/cloud-overlay-*.test.py'
      - '.github/workflows/runtime-build.yml'

# This is a path-filtered, on-demand check. If configured as a required status,
# provide an always-present lightweight summary so skipped workflows do not
# leave documentation-only pull requests waiting for a missing check.

permissions:
  contents: read

jobs:
  runtime-build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked runtime output
        run: |
          if [ -n "$(git ls-files -- out/)" ]; then
            echo '::error::Source-only runtime policy prohibits tracked out/ files.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Pin npm and install locked compiler dependencies
        run: |
          npm install --global npm@11.17.0
          npm ci --ignore-scripts --no-audit --no-fund --include=dev
      - name: Build complete runtime from the checked out commit
        run: node tools/build-runtime-artifact.cjs --repo . --source "$GITHUB_SHA" --output "$RUNNER_TEMP/runtime-artifact" --dependency-root .
      # The fixed-SHA build above is complete. Index isolation and dirty-tree
      # rejection are covered with disposable fixtures, not a second full build.
      - name: Runtime build and index guard regressions
        run: node --test tests/runtime-build-artifact.test.cjs tests/runtime-build-tree.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cloud overlay regressions
        env:
          STARPOINT_TEST_DEPENDENCY_ROOT: ${{ github.workspace }}
        run: |
          python tests/cloud-overlay-release.test.py
          python tests/cloud-overlay-source-build.test.py
          python tests/cloud-overlay-selection.test.py
